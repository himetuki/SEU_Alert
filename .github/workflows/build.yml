name: build

# 自动构建 + 分发：
#   - 任意 push / PR → 单元测试 + 构建 Windows 便携版与 Linux 服务器版，上传 artifact
#   - 打 tag v* → 额外创建 GitHub Release，上传两份产物
#   - 手动 workflow_dispatch → 可勾选「创建 Release」
#
# 产物（均在项目根 dist/，已被 .gitignore 忽略）：
#   dist/seu_alert-portable-win.zip   Windows 便携版（win/ 构建脚本产出）
#   dist/seu_alert-portable-server.tar.gz  Linux 服务器版（linux/ 构建脚本产出）

on:
  push:
    branches: ["**"]
    tags: ["v*"]            # 打 v* 标签 → 构建 + 创建 Release
  pull_request:
    paths:
      - "src/**"
      - "win/**"
      - "linux/**"
      - "config/**"
      - ".env.example"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      release:
        description: "创建 GitHub Release 并上传产物（否则仅构建 + artifact）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q

  win:
    name: Windows 便携版
    runs-on: windows-latest
    needs: test
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: 构建便携版
        # 用 pwsh（PowerShell 7）：Windows PowerShell 5.1 会把无 BOM 的 UTF-8 脚本
        # 按 ANSI 解析，中文字符串字面量会直接语法报错。脚本本身已带 UTF-8 BOM 兜底。
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File win/build_portable.ps1 -Python python
      - name: 校验产物
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/seu_alert-portable-win/seu_alert.exe")) { throw "缺少 seu_alert.exe" }
          if (-not (Test-Path "dist/seu_alert-portable-win.zip")) { throw "缺少 seu_alert-portable-win.zip" }
          "win 产物 OK"
      - uses: actions/upload-artifact@v4
        with:
          name: seu_alert-portable-win
          path: dist/seu_alert-portable-win.zip
          if-no-files-found: error

  linux:
    name: Linux 服务器版
    runs-on: ubuntu-latest
    needs: test
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: 构建服务器版
        run: bash linux/build_server.sh
      - name: 校验产物
        run: |
          test -x dist/seu_alert-portable-server/seu_alert-server || { echo "缺少可执行文件" >&2; exit 1; }
          test -f dist/seu_alert-portable-server.tar.gz || { echo "缺少 tar.gz" >&2; exit 1; }
          echo "linux 产物 OK"
      - uses: actions/upload-artifact@v4
        with:
          name: seu_alert-portable-server
          path: dist/seu_alert-portable-server.tar.gz
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [win, linux]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: 展示产物
        run: find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.tar.gz" \) -print
      - name: 生成 SHA256 校验和
        run: |
          sha256sum seu_alert-portable-win/seu_alert-portable-win.zip \
                    seu_alert-portable-server/seu_alert-portable-server.tar.gz > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SEU_Alert ${{ github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            seu_alert-portable-win/seu_alert-portable-win.zip
            seu_alert-portable-server/seu_alert-portable-server.tar.gz
            checksums.txt
