# Web 采集源（ADR-022/024/029）
# root 相对项目根解析；首次扫描全量 backfill，之后增量（web_seen 表去重）。
# enabled: false 的源不参与轮询（默认未写即 true）。

sources:
  - id: jwc
    kind: jwc                    # 教务处六栏目**直采**（ADR-029，自包含，无需外部程序）
    name: 教务处通知（直采）
    root: config/jwc.yml
    interval: 900                # 秒；≥60

  # 旧通道（ADR-022）：读 SEU-Monitor（Go）归档库。
  # ADR-029 起 jwc 直采已替代它，默认停用；若仍想在 WSL 里跑 SEU-Monitor，
  # 把 enabled 改回 true 即可继续消费其归档数据。
  - id: seu-monitor
    kind: seu_monitor
    name: 教务处通知（SEU-Monitor）
    root: seu-projects-test/SEU-Monitor/store
    interval: 900                # 真实部署在 Linux：root 改 ~/.local/share/seu-monitor
    enabled: false

  - id: seudaily
    kind: seudaily               # SEUdaily 网页库：metadata/*.json + files/<host>/<section>/<notice>/*.md
    name: SEUdaily 网页库
    root: seu-projects-test/SEUdaily/.seudaily/web-files
    interval: 900

  - id: seu-colleges
    kind: seu_colleges           # 全院系 33 个学院官网通知（ADR-024；root=colleges.yml）
    name: 各学院通知（33 院系）
    root: config/colleges.yml
    interval: 1800                # 学院站低频，30 分钟一轮

  - id: labor
    kind: labor                  # 劳动教育课程平台（ADR-024，移植 SEU-Labor-Course-Pusher 源码逻辑）
    name: 劳动教育课程
    root: config/labor.yml
    interval: 300                 # 选课抢名额，5 分钟一轮

  - id: wechat-mp
    kind: wechat_mp              # 公众号监控（ADR-025，免登录+模型代读；默认 东南大学文化素质教育中心）
    name: 公众号文章
    root: config/wechat-mp.yml
    interval: 1800                # 搜狗有风控，30 分钟一轮

  - id: seu-lectures
    kind: seu_lectures           # 人文讲座预约系统监控（ADR-025，移植 seu-lecture-cli 监控能力）
    name: 人文讲座
    root: config/seu-lectures.yml
    interval: 900                 # 15 分钟一轮（预约开放时间敏感）
