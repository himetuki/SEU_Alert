# Web 采集源（ADR-022/024：消费现有项目输出库 + 全院系直采 + 劳动教育移植）
# root 相对项目根解析；首次扫描全量 backfill，之后增量（web_seen 表去重）。

sources:
  - id: seu-monitor
    kind: seu_monitor            # SEU-Monitor（Go）归档库：web/教务处/<栏目>/<标题--ID>/
    name: 教务处通知（SEU-Monitor）
    root: seu-projects-test/SEU-Monitor/store
    interval: 900                # 秒；≥60。真实部署在 Linux 跑监控，root 改 ~/.local/share/seu-monitor

  - id: seudaily
    kind: seudaily               # SEUdaily 网页库：metadata/*.json + files/<host>/<section>/<notice>/*.md
    name: SEUdaily 网页库
    root: seu-projects-test/SEUdaily/.seudaily/web-files
    interval: 900

  - id: seu-colleges
    kind: seu_colleges           # 全院系 33 个学院官网通知（ADR-024；root=colleges.yml）
    name: 各学院通知（33 院系）
    root: config/colleges.yml
    interval: 1800                # 学院站低频，30 分钟一轮

  - id: labor
    kind: labor                  # 劳动教育课程平台（ADR-024，移植 SEU-Labor-Course-Pusher 源码逻辑）
    name: 劳动教育课程
    root: config/labor.yml
    interval: 300                 # 选课抢名额，5 分钟一轮
